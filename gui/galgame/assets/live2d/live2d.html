<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莲心 Live2D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
}
body { position: relative; }
canvas#live2d-canvas { display: block; }
#loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #999; font-family: sans-serif; font-size: 14px;
    pointer-events: none;
}
</style>
</head>
<body>
<div id="loading">加载 Live2D 模型中…</div>
<canvas id="live2d-canvas"></canvas>

<script src="vendor/pixi.min.js"></script>
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/cubism4.min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
(function() {
    'use strict';

    var app = null;
    var model = null;
    var bridge = null;
    var loadingEl = document.getElementById('loading');

    // 窗口拖拽状态（由 JS 管理，通过 bridge 通知 Python）
    var winDragging = false;

    // ── QWebChannel 桥接 ─────────────────────────────────────
    new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
    });

    // ── 鼠标事件 ────────────────────────────────────────────
    // 左键 → 拖拽窗口    中键 → 拖拽模型    右键 → 切换对话框
    // 滚轮 → 缩放模型
    function setupInputHandlers(stageElement) {
        // 右键 → 通知 Python 切换对话框
        stageElement.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            if (bridge && typeof bridge.onRightClick === 'function') {
                bridge.onRightClick();
            }
        });

        // 左键按下 → 窗口拖拽（无论是否点击在模型上）
        stageElement.addEventListener('pointerdown', function(e) {
            if (e.button !== 0) return;
            if (!bridge) return;

            winDragging = true;
            if (typeof bridge.onDragStart === 'function') {
                bridge.onDragStart(e.screenX, e.screenY);
            }
            e.preventDefault();
        }, true);

        // 鼠标移动 → 窗口拖拽
        document.addEventListener('pointermove', function(e) {
            if (!winDragging || !bridge) return;
            if (typeof bridge.onDragMove === 'function') {
                bridge.onDragMove(e.screenX, e.screenY);
            }
            e.preventDefault();
        }, true);

        // 鼠标释放 → 结束窗口拖拽
        document.addEventListener('pointerup', function(e) {
            if (!winDragging) return;
            winDragging = false;
            if (bridge && typeof bridge.onDragEnd === 'function') {
                bridge.onDragEnd();
            }
        }, true);
    }

    // ── 初始化 PixiJS + Live2D ───────────────────────────────
    async function initLive2D() {
        if (typeof PIXI === 'undefined') throw new Error('PIXI 未加载');
        if (!PIXI.live2d || !PIXI.live2d.Live2DModel) throw new Error('pixi-live2d-display 未加载');

        app = new PIXI.Application({
            view: document.getElementById('live2d-canvas'),
            resizeTo: window,
            autoStart: true,
            antialias: true,
            backgroundAlpha: 0,
        });
        app.stage.interactive = true;

        // 安装鼠标事件处理
        setupInputHandlers(app.view);

        // 加载模型
        var modelUrl = 'models/hiyori/hiyori_pro_t11.model3.json';
        model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false });
        model.anchor.set(0.5, 0.5);
        model.scale.set(0.28);
        model.x = app.screen.width * 0.5;
        model.y = app.screen.height * 0.75;
        model.interactive = true;
        app.stage.addChild(model);

        // 拖拽模型在画布内移动（仅中键）
        var modelDragging = false, dragOffset = { x: 0, y: 0 };
        model.on('pointerdown', function(e) {
            var orig = e.data.originalEvent;
            if (!orig || orig.button !== 1) return; // 仅中键
            var p = e.data.getLocalPosition(app.stage);
            modelDragging = true;
            dragOffset.x = model.x - p.x;
            dragOffset.y = model.y - p.y;
            e.data.originalEvent.preventDefault();
        });
        app.stage.on('pointermove', function(e) {
            if (!modelDragging) return;
            var p = e.data.getLocalPosition(app.stage);
            model.x = p.x + dragOffset.x;
            model.y = p.y + dragOffset.y;
        });
        app.stage.on('pointerup', function() { modelDragging = false; });
        app.stage.on('pointerupoutside', function() { modelDragging = false; });

        // 滚轮缩放
        app.view.addEventListener('wheel', function(e) {
            if (e.target.closest('canvas')) {
                e.preventDefault();
                var scaleStep = e.deltaY < 0 ? 1.06 : 0.94;
                var next = Math.min(3.2, Math.max(0.08, model.scale.x * scaleStep));
                model.scale.set(next);
            }
        }, { passive: false });

        // 通知 Python 端模型已就绪
        if (bridge && typeof bridge.onModelReady === 'function') {
            bridge.onModelReady();
        }

        loadingEl.style.display = 'none';
    }

    // ── 外部可调用的 API（由 Python 通过 runJavaScript 调用） ──
    window._live2d = {
        setMouthValue: function(value) {
            if (!model || !model.internalModel || !model.internalModel.coreModel) return;
            try {
                model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', value);
            } catch(e) {}
        },
        setScaleRelative: function(factor) {
            if (!model) return;
            var next = Math.min(3.2, Math.max(0.08, model.scale.x * factor));
            model.scale.set(next);
        },
        setScaleAbsolute: function(s) {
            if (!model) return;
            model.scale.set(Math.min(3.2, Math.max(0.08, s)));
        },
        resetView: function() {
            if (!model || !app) return;
            model.x = app.screen.width * 0.5;
            model.y = app.screen.height * 0.75;
            model.scale.set(0.28);
        },
        onResize: function(w, h) {
            if (app && typeof app.renderer.resize === 'function') {
                app.renderer.resize(w, h);
            }
        },
        destroy: function() {
            if (model) { try { model.destroy({ children: true }); } catch(e) {} model = null; }
            if (app) { try { app.destroy(true); } catch(e) {} app = null; }
        },
    };

    // ── 启动 ──
    initLive2D().catch(function(err) {
        loadingEl.textContent = '模型加载失败: ' + (err.message || err);
        console.error(err);
    });
})();
</script>
</body>
</html>
